# =============================================================================
# 说明：本文件里的路径全部是「项目相对路径或环境变量」，不含任何绝对路径，
#       保证工程可以整体搬走。构建前务必先 `source scripts/env.sh`。
# =============================================================================

# --- JVM 内存（构建 Compose 项目 3G 够用；机器内存吃紧可降到 2048m）---
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# --- 构建性能（依赖缓存会落在 GRADLE_USER_HOME，即项目内 toolchain/gradle-home）---
org.gradle.parallel=true
org.gradle.caching=true

# --- Kotlin ---
kotlin.code.style=official

# --- AndroidX：Compose 项目必须开启 ---
android.useAndroidX=true

# --- R 类非传递 ---
android.nonTransitiveRClass=true
